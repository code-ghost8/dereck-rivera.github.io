<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Redes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
  min-height:100vh;display:flex;justify-content:center;align-items:center;
  background:#050a05;position:relative;padding:20px;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:url('fondo.png') center/cover no-repeat;
  opacity:0.9;z-index:0;
}
body::after{
  content:'';position:fixed;inset:0;
  background:radial-gradient(circle at top, rgba(0,255,80,0.2), transparent 60%);
  z-index:1;
}
.card{
  position:relative;z-index:10;width:100%;max-width:390px;
  background:rgba(10,20,10,0.78);backdrop-filter:blur(16px);
  border:1.5px solid rgba(0,255,80,0.5);border-radius:30px;
  padding:30px 26px;text-align:center;
  box-shadow:0 0 30px rgba(0,255,80,0.4), 0 0 80px rgba(0,255,80,0.15);
}
.avatar{
  width:120px;height:120px;border-radius:50%;border:3px solid #00ff50;
  margin:0 auto 14px;background:url('foto.jpg') center top / cover;
  box-shadow:0 0 20px rgba(0,255,80,0.8), 0 0 0 6px rgba(0,255,80,0.2);
}
h1{font-family:'Space Grotesk';font-size:26px;color:white;letter-spacing:-0.5px}
.user{font-size:13px;color:#7aff9a;font-weight:700;letter-spacing:1px;margin:4px 0 20px}
.badge{
  display:inline-block;background:#00ff50;color:#001a05;
  padding:5px 14px;border-radius:20px;font-size:11px;font-weight:800;
  margin-bottom:18px;box-shadow:0 0 15px rgba(0,255,80,0.6);
}
.link{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:14px;margin:12px 0;border-radius:50px;
  text-decoration:none;font-weight:800;font-size:15px;
  border:1.5px solid rgba(255,255,255,0.15);color:white;
  transition:0.2s;backdrop-filter:blur(5px);
}
.link:hover{transform:scale(1.04) translateY(-2px);box-shadow:0 10px 25px rgba(0,0,0,0.4)}
.tiktok{background:rgba(0,0,0,0.7);border-color:rgba(0,255,80,0.3)}
.whatsapp{background:linear-gradient(90deg,#0a7a2a,#00ff50);color:#001a05}
.instagram{background:linear-gradient(45deg,#0f3d1a,#00ff50);color:white;border-color:#00ff50}
.facebook{background:linear-gradient(90deg,#0a3a15,#1a7a2e)}
.footer{margin-top:20px;font-size:11px;color:#7aff9a;opacity:0.6}
</style>
</head>
<body>
<div class="card">
  <div class="avatar"></div>
  <h1>Geer GJ 👑</h1>
  <a class="link tiktok" href="https://www.tiktok.com/@adrnhvp.09" target="_blank">🎵 TikTok</a>
  <a class="link whatsapp" href="https://wa.me/593985951634" target="_blank">💬 WhatsApp</a>
  <a class="link instagram" href="https://www.instagram.com/riv.aust" target="_blank">📸 Instagram</a>
  <a class="link facebook" href="https://www.facebook.com/d3reck.rivera" target="_blank">📘 Facebook</a>
  <div class="footer">GJ 👑</div>
</div>
</body>
</html>
